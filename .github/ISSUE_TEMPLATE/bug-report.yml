name: Report a bug
description: Something in Downhill isn't working right
title: 'Bug: '
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play level …
        2. Tap …
        3. …
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. iPhone 15, iOS 26
  - type: input
    id: version
    attributes:
      label: Game version
