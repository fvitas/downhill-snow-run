<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Downhill feature graphic, 1024 × 500</title>
    <style>
      html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #0a4478; }
      .art {
        position: absolute; inset: 0;
        background: url('../assets/icon-1024.png') no-repeat;
        background-size: 1180px 1180px;
        background-position: -40px -560px;
      }
      .shade {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, rgba(8, 44, 92, 0.92) 0%, rgba(8, 44, 92, 0.78) 30%, rgba(8, 44, 92, 0) 58%);
      }
      .copy {
        position: absolute; left: 64px; top: 50%; transform: translateY(-50%);
        color: #fff; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
        text-shadow: 0 4px 18px rgba(0, 20, 50, 0.45);
      }
      .title { font-size: 96px; font-weight: 800; line-height: 0.95; letter-spacing: -1px; }
      .sub { font-size: 44px; font-weight: 700; color: #ffb35c; margin-top: 6px; }
      .tag { font-size: 24px; font-weight: 600; margin-top: 22px; opacity: 0.92; }
    </style>
  </head>
  <body>
    <div class="art"></div>
    <div class="shade"></div>
    <div class="copy">
      <div class="title">Downhill</div>
      <div class="sub">Snow Run</div>
      <div class="tag">One tap. 500 levels. Ten worlds.</div>
    </div>
  </body>
</html>
